   --gy-bg 在桌面宽度下被 .gy-page 整个盖住、根本看不见。所以「换背景」=
   换 .gy-page 的 background，这是最小且唯一正确的改法。

   挂在 .gy-page 上还顺带解决了一个问题：body 上那两个 fixed 装饰光斑是
   z-index: 0，而 .gy-page 是 z-index: 1，本来就压在它们上面。如果改挂到
   .gy-root（z-index auto），body::after 会反过来盖在图上 —— 它右上角那团淡紫
   径向渐变会把丝绸染紫，既难看又违反「灰色版背景必须 R = G = B」这条规则。
   挂 .gy-page 就不需要额外去关光斑。

   图片构建时内联成 data URI（tools/silk/load-skin.mjs），所以产物是单文件。
   这层皮肤同时挂在主产物和对比变体上，两个脚本共用那个模块。

   图本身也调过：tools/silk/make-background.mjs 在去色之后又按 lift=0.5 抬浅，
   最暗处 199 → 227、均值 233 → 244。这是为了让平台的表格页能读 —— 那张表的
   正文不是卡片、直接落在页面背景上，丝纹的暗带一浓，姓名邮箱那些字就糊在花纹里。

   只有窄屏（≤1000px，.gy-page 变成 auto 高度）露出下面那条带时才会看到，用同
   色调的灰就不会出现一条突兀的边。这里不能再写 #e9e9e9 —— 那是抬浅之前的均值，
   会跟上面的图差出 11 级，窄屏下就是一条明显的深色横带。 */
.gy-root { background: #f4f4f4; }

    <script>
      // Every single-file build is a sibling of this shell's dist output, so a
      // file:// open of any of them must be allowed through. A build whose name
      // is missing here does not fail loudly — it silently redirects to
      // nomos-standalone.html and you end up measuring the wrong theme.
      const BUILT = ['nomos-standalone.html', 'nomos-figma.html', 'nomos-silk.html']
      if (window.location.protocol === 'file:' && !BUILT.some(name => window.location.pathname.endsWith(name))) {
        window.location.replace('./nomos-standalone.html')
      }

- 法域：中国大陆
- 收录范围：民法典第三编「合同」全文，以及合同编通则部分的适用要点

## 第一分编 通则

### 第一章 一般规定
- 调整范围：因合同产生的民事关系
- 婚姻、收养、监护等身份关系的协议，适用其他法律规定
- 非因合同产生的债权债务关系，没有特别规定的，适用本编通则

### 第二章 合同的订立
- 合同形式：书面、口头或者其他形式
- 要约与承诺：构成要件、生效时点、撤回与撤销
- 格式条款：提示说明义务、不合理免责条款的效力、不利解释规则
- 缔约过失责任

### 第三章 合同的效力
- 生效时点与附条件、附期限
- 无效、可撤销、效力待定三类情形
- 无权代理与表见代理

### 第四章 合同的履行
- 全面履行原则与诚信原则
- 履行主体、地点、期限、方式约定不明时的补充规则
- 同时履行抗辩、先履行抗辩、不安抗辩

### 第五章 合同的保全
- 债权人代位权
- 债权人撤销权

### 第六章 合同的变更和转让
### 第七章 合同的权利义务终止
- 清偿、抵销、提存、免除、混同
- 法定解除与约定解除的条件与后果

### 第八章 违约责任
- 继续履行、采取补救措施、赔偿损失
- 违约金与定金规则
- 不可抗力与情势变更

- 法域：中国大陆
- 版本：2023 年修订 · 2024 年 7 月 1 日施行
- 最后校对：2026-09-12

## 本次修订的主要变化
- 有限责任公司股东认缴出资：自公司成立之日起五年内缴足
- 出资加速到期：公司不能清偿到期债务时，公司或已到期债权人可要求提前缴纳
- 法定代表人由代表公司执行事务的董事或者经理担任，辞任规则明确
- 股东会与董事会职权调整，审计委员会可以替代监事会
- 新增简易注销与强制注销程序
