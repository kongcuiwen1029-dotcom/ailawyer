<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>未来律所首页效果图</title>
  <style>
    :root {
      --bg-a: #f4f7ff;
      --bg-b: #f8f3ff;
      --bg-c: #fdfafe;
      --glass: rgba(255, 255, 255, 0.36);
      --glass-strong: rgba(255, 255, 255, 0.58);
      --glass-soft: rgba(255, 255, 255, 0.22);
      --line: rgba(255, 255, 255, 0.78);
      --line-soft: rgba(118, 95, 241, 0.12);
      --text: #29233d;
      --muted: #6d6786;
      --muted-2: #9892b2;
      --violet: #7567db;
      --violet-deep: #5f56b8;
      --violet-soft: rgba(117, 103, 219, 0.08);
      --pink: rgba(237, 188, 230, 0.26);
      --cyan: rgba(190, 226, 250, 0.34);
      --shadow-shell: 0 30px 72px rgba(112, 96, 173, 0.09);
      --shadow-panel: 0 12px 28px rgba(103, 88, 166, 0.06);
      --shadow-float: 0 12px 24px rgba(95, 86, 184, 0.14);
      --radius-shell: 34px;
      --radius-xl: 28px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 18%, rgba(190, 226, 250, 0.5), transparent 22%),
        radial-gradient(circle at 86% 14%, rgba(237, 188, 230, 0.26), transparent 22%),
        radial-gradient(circle at 74% 80%, rgba(117, 103, 219, 0.1), transparent 28%),
        linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 50%, var(--bg-c) 100%);
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.84;
      z-index: 0;
      pointer-events: none;
      animation: drift 18s ease-in-out infinite alternate;
    }

    body::before {
      width: 420px;
      height: 420px;
      left: -120px;
      bottom: -140px;
      background: radial-gradient(circle, rgba(190, 226, 250, 0.56), transparent 66%);
    }

    body::after {
      width: 520px;
      height: 520px;
      top: -180px;
      right: -120px;
      background: radial-gradient(circle, rgba(210, 185, 239, 0.34), transparent 68%);
      animation-duration: 22s;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1880px, calc(100vw - 32px));
      height: min(1260px, calc(100vh - 32px));
      margin: 16px auto;
      padding: 14px;
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0.24)),
        linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(255, 255, 255, 0.84);
      box-shadow: var(--shadow-shell), inset 0 1px 0 rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(22px) saturate(145%);
      overflow: hidden;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(118deg, rgba(255, 255, 255, 0.58), transparent 18%, transparent 78%, rgba(255, 255, 255, 0.22)),
        radial-gradient(circle at 24% -6%, rgba(255, 255, 255, 0.6), transparent 28%);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .layout {
      height: 100%;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 14px;
    }

    .sidebar,
    .hero-panel,
    .composer,
    .chip,
    .quick-pill,
    .utility-fab {
      position: relative;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.28));
      border: 1px solid rgba(255, 255, 255, 0.84);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), var(--shadow-panel);
      backdrop-filter: blur(18px) saturate(140%);
    }

    .sidebar::before,
    .hero-panel::before,
    .composer::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.96), transparent);
      pointer-events: none;
    }

    .sidebar {
      border-radius: 24px;
      padding: 16px 14px 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 2px 2px 22px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      position: relative;
      background: linear-gradient(135deg, rgba(119, 95, 255, 0.98), rgba(189, 150, 255, 0.78));
      box-shadow: 0 10px 20px rgba(101, 86, 172, 0.16);
      flex: none;
      overflow: hidden;
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      inset: 7px 9px 7px 7px;
      border-radius: 15px 15px 15px 6px;
      border: 4px solid rgba(255, 255, 255, 0.96);
      border-right-width: 5px;
      transform: rotate(10deg);
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      right: 7px;
      bottom: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.96);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .section-label {
      margin: 4px 2px 10px;
      font-size: 11px;
      color: var(--muted-2);
      font-weight: 600;
    }

    .nav-group {
      display: grid;
      gap: 7px;
      margin-bottom: 18px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      color: var(--text);
      font-size: 15px;
      font-weight: 550;
      text-decoration: none;
      transition: 180ms ease;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateX(3px);
    }

    .nav-item.active {
      background:
        linear-gradient(135deg, rgba(117, 103, 219, 0.1), rgba(255, 255, 255, 0.56)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.76), rgba(255, 255, 255, 0.36));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92), 0 8px 18px rgba(117, 103, 219, 0.08);
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      position: relative;
      flex: none;
      color: currentColor;
    }

    .nav-icon.plus::before,
    .nav-icon.plus::after,
    .nav-icon.doc::before,
    .nav-icon.doc::after,
    .nav-icon.msg::before,
    .nav-icon.msg::after {
      content: "";
      position: absolute;
      border-color: currentColor;
      color: currentColor;
    }

    .nav-icon.plus {
      border: 1.8px solid currentColor;
      border-radius: 50%;
    }

    .nav-icon.plus::before,
    .nav-icon.plus::after {
      left: 50%;
      top: 50%;
      background: currentColor;
      border-radius: 999px;
      transform: translate(-50%, -50%);
    }

    .nav-icon.plus::before {
      width: 10px;
      height: 1.8px;
    }

    .nav-icon.plus::after {
      width: 1.8px;
      height: 10px;
    }

    .nav-icon.doc::before {
      inset: 2px 3px 3px 3px;
      border: 1.8px solid currentColor;
      border-radius: 4px;
      background: transparent;
    }

    .nav-icon.doc::after {
      width: 7px;
      height: 7px;
      right: 3px;
      top: 2px;
      border-top: 1.8px solid currentColor;
      border-right: 1.8px solid currentColor;
      transform: skew(-10deg, -10deg);
      background: transparent;
    }

    .nav-icon.msg::before {
      inset: 3px;
      border: 1.8px solid currentColor;
      border-radius: 50%;
      background: transparent;
    }

    .nav-icon.msg::after {
      width: 7px;
      height: 7px;
      left: 3px;
      bottom: 1px;
      border-left: 1.8px solid currentColor;
      border-bottom: 1.8px solid currentColor;
      border-radius: 0 0 0 6px;
      transform: rotate(-32deg);
      background: transparent;
    }

    .sidebar-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 4px;
      color: var(--muted);
    }

    .footer-user,
    .footer-collapse {
      width: 24px;
      height: 24px;
      position: relative;
      border-radius: 999px;
    }

    .footer-user::before,
    .footer-user::after,
    .footer-collapse::before,
    .footer-collapse::after {
      content: "";
      position: absolute;
      background: currentColor;
      border-radius: 999px;
    }

    .footer-user::before {
      width: 8px;
      height: 8px;
      left: 10px;
      top: 5px;
    }

    .footer-user::after {
      width: 14px;
      height: 8px;
      left: 7px;
      bottom: 5px;
      border-radius: 8px 8px 4px 4px;
    }

    .footer-collapse::before,
    .footer-collapse::after {
      width: 7px;
      height: 1.8px;
      top: 13px;
    }

    .footer-collapse::before {
      left: 7px;
      transform: rotate(-40deg);
    }

    .footer-collapse::after {
      left: 12px;
      transform: rotate(40deg);
    }

    .main {
      min-width: 0;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .main::before {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.24), transparent 68%);
      filter: blur(22px);
      pointer-events: none;
    }

    .hero-panel {
      width: min(900px, 88%);
      padding: 44px 48px 40px;
      border-radius: 30px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.62), transparent 34%),
        radial-gradient(circle at 85% 10%, rgba(196, 154, 255, 0.1), transparent 24%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.44), rgba(255, 255, 255, 0.14));
    }

    .hero-logo {
      width: 54px;
      height: 54px;
      margin: 0 auto 18px;
      border-radius: 18px;
      position: relative;
      background: linear-gradient(135deg, rgba(119, 95, 255, 0.98), rgba(187, 143, 255, 0.78));
      box-shadow: 0 10px 22px rgba(101, 86, 172, 0.14);
      overflow: hidden;
    }

    .hero-logo::before {
      content: "";
      position: absolute;
      inset: 9px 12px 9px 9px;
      border-radius: 20px 20px 20px 7px;
      border: 6px solid rgba(255, 255, 255, 0.96);
      border-right-width: 7px;
      transform: rotate(10deg);
    }

    .hero-logo::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      right: 10px;
      bottom: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.96);
    }

    .hero-title {
      margin: 0 0 30px;
      font-size: clamp(30px, 2.9vw, 46px);
      line-height: 1.18;
      font-weight: 430;
      letter-spacing: -0.04em;
    }

    .hero-title .accent {
      color: var(--violet-deep);
      text-shadow: 0 0 14px rgba(117, 103, 219, 0.06);
    }

    .composer-wrap {
      display: grid;
      gap: 22px;
      justify-items: center;
    }

    .composer {
      width: min(760px, 100%);
      min-height: 150px;
      border-radius: 24px;
      padding: 20px 20px 14px;
      text-align: left;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.5)),
        linear-gradient(135deg, rgba(117, 103, 219, 0.03), rgba(190, 226, 250, 0.03));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.96),
        0 14px 26px rgba(103, 88, 166, 0.08);
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 14px;
    }

    .composer-placeholder {
      color: #918ba9;
      font-size: 16px;
      line-height: 1.6;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.5)),
        linear-gradient(135deg, rgba(119, 95, 255, 0.08), rgba(255, 255, 255, 0.42));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.96);
      color: #4d4765;
      font-size: 15px;
      font-weight: 600;
      width: fit-content;
    }

    .chip-icon {
      width: 16px;
      height: 16px;
      border: 1.8px solid currentColor;
      border-radius: 4px;
      position: relative;
    }

    .chip-icon::before,
    .chip-icon::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-left: 1.6px solid currentColor;
      border-right: 1.6px solid currentColor;
      width: 7px;
    }

    .chip-icon::before {
      top: 2px;
      bottom: 7px;
    }

    .chip-icon::after {
      top: 8px;
      bottom: 2px;
    }

    .send-button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #655dc4, #8278d8);
      box-shadow: var(--shadow-float);
      position: relative;
      flex: none;
    }

    .send-button::before,
    .send-button::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: #fff;
      border-radius: 999px;
      transform: translate(-50%, -50%);
    }

    .send-button::before {
      width: 1.8px;
      height: 13px;
      top: 47%;
    }

    .send-button::after {
      width: 9px;
      height: 9px;
      border-right: 1.8px solid #fff;
      border-top: 1.8px solid #fff;
      background: transparent;
      transform: translate(-50%, -22%) rotate(-45deg);
    }

    .quick-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .quick-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      color: var(--text);
      font-size: 15px;
      font-weight: 550;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.44)),
        linear-gradient(135deg, rgba(119, 95, 255, 0.06), rgba(255, 255, 255, 0.4));
    }

    .quick-icon {
      width: 18px;
      height: 18px;
      position: relative;
      flex: none;
      color: currentColor;
    }

    .quick-icon.book::before,
    .quick-icon.book::after,
    .quick-icon.search::before,
    .quick-icon.search::after,
    .quick-icon.pen::before,
    .quick-icon.pen::after {
      content: "";
      position: absolute;
      border-color: currentColor;
    }

    .quick-icon.book::before {
      inset: 2px 1px 2px 1px;
      border: 1.8px solid currentColor;
      border-radius: 4px;
      background: transparent;
    }

    .quick-icon.book::after {
      left: 8px;
      top: 2px;
      bottom: 2px;
      width: 1.8px;
      background: currentColor;
      border-radius: 999px;
    }

    .quick-icon.search::before {
      width: 10px;
      height: 10px;
      left: 2px;
      top: 2px;
      border: 1.8px solid currentColor;
      border-radius: 50%;
    }

    .quick-icon.search::after {
      width: 7px;
      height: 1.8px;
      right: 1px;
      bottom: 3px;
      background: currentColor;
      transform: rotate(45deg);
      border-radius: 999px;
    }

    .quick-icon.pen::before {
      width: 12px;
      height: 4px;
      left: 2px;
      top: 7px;
      border: 1.8px solid currentColor;
      border-radius: 4px;
      transform: rotate(-38deg);
      background: transparent;
    }

    .quick-icon.pen::after {
      width: 5px;
      height: 5px;
      right: 1px;
      top: 10px;
      border-top: 1.8px solid currentColor;
      border-right: 1.8px solid currentColor;
      transform: rotate(10deg);
      background: transparent;
    }

    .utility-fab {
      position: absolute;
      right: 26px;
      bottom: 22px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background:
        linear-gradient(135deg, rgba(239, 194, 225, 0.72), rgba(255, 255, 255, 0.92)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.54));
    }

    .utility-fab::before,
    .utility-fab::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      border-radius: 999px;
    }

    .utility-fab::before {
      width: 16px;
      height: 16px;
      border: 1.8px solid #e58ebc;
      border-top-color: transparent;
      transform: translate(-50%, -50%) rotate(18deg);
    }

    .utility-fab::after {
      width: 4px;
      height: 4px;
      background: #e58ebc;
      left: 24px;
      top: 15px;
    }

    @keyframes drift {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(18px, -18px, 0) scale(1.05);
      }
    }

    @media (max-width: 1280px) {
      html,
      body {
        overflow: auto;
      }

      .page {
        height: auto;
        min-height: calc(100vh - 24px);
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .main {
        min-height: 860px;
      }

      .hero-panel {
        width: 96%;
        padding: 40px 22px;
      }

      .hero-title {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"></div>
          <div class="brand-title">未来律所</div>
        </div>

        <div class="section-label">功能</div>
        <div class="nav-group">
          <a class="nav-item active" href="#">
            <span class="nav-icon plus"></span>
            <span>新建</span>
          </a>
          <a class="nav-item" href="#">
            <span class="nav-icon doc"></span>
            <span>项目</span>
          </a>
        </div>

        <div class="section-label">其他</div>
        <div class="nav-group">
          <a class="nav-item" href="#">
            <span class="nav-icon msg"></span>
            <span>产品反馈</span>
          </a>
        </div>

        <div class="sidebar-footer">
          <div class="footer-user"></div>
          <div class="footer-collapse"></div>
        </div>
      </aside>

      <main class="main">
        <section class="hero-panel">
          <div class="hero-logo"></div>
          <h1 class="hero-title">早上好，我是 <span class="accent">未来律所</span></h1>

          <div class="composer-wrap">
            <div class="composer">
              <div class="composer-placeholder">帮您处理什么?</div>
              <div class="composer-bottom">
                <div class="chip">
                  <span class="chip-icon"></span>
                  <span>知识库</span>
                </div>
                <div class="send-button"></div>
              </div>
            </div>

            <div class="quick-actions">
              <div class="quick-pill">
                <span class="quick-icon book"></span>
                <span>法律咨询</span>
              </div>
              <div class="quick-pill">
                <span class="quick-icon search"></span>
                <span>法律检索</span>
              </div>
              <div class="quick-pill">
                <span class="quick-icon pen"></span>
                <span>文件审查</span>
              </div>
            </div>
          </div>
        </section>

        <div class="utility-fab"></div>
      </main>
    </div>
  </div>
</body>
</html>
